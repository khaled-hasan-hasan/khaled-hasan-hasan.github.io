name: Review checks and downloadable artifacts

on:
  push:
    branches:
      - feature/premium-analytics-portfolio

# Deliberately no Pages, Cloudflare, deployment, DNS or repository-write permission.
permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install development checks only
        run: npm ci --ignore-scripts
      - name: Build and verify static source and DOM interactions
        run: |
          python3 scripts/build.py
          npm run check
      - name: Install Chromium for isolated browser review
        run: npx playwright install --with-deps chromium
      - name: Capture real viewports and run Lighthouse on localhost
        run: node scripts/browser-review.mjs --output review-artifacts/browser-qa
      - name: Package source, audit, test results and browser review
        if: always()
        run: |
          python3 scripts/package-review.py --output review-artifacts --qa-path review-artifacts/browser-qa
          python3 scripts/verify-review.py review-artifacts/SmartDataVisions-review-package.zip
      - name: Upload complete review package
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: SmartDataVisions-review-package
          path: review-artifacts/smartdatavisions-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload browser screenshots and raw Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: SmartDataVisions-browser-QA
          path: review-artifacts/browser-qa/
          if-no-files-found: error
          retention-days: 30
      - name: Upload standalone static website
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: SmartDataVisions-website
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
